<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Clouds</title>
<style>
  :root { --bg: #05080f; --fg: #dbe6ff; --border: rgba(255,255,255,.09); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.6 ui-monospace, "SF Mono", Menlo, monospace; }
  .cloud { display: block; width: 100%; height: 100%; pointer-events: none; }
  .hero { position: relative; height: 44svh; max-height: 560px; min-height: 288px; }
  .hero h1 { position: absolute; left: 24px; bottom: 24px; margin: 0;
             font-size: clamp(28px, 6vw, 52px); letter-spacing: -.02em; }
  .strip { position: relative; height: 144px; overflow: hidden;
           border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .body { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
  .foot { height: 192px; }
</style>
</head>
<body>
  <header class="hero"><canvas class="cloud" data-direction="down" data-seed="0"></canvas><h1>Pixel Clouds</h1></header>
  <main class="body">
    <p>Ordered-dither value noise with domain warping, drawn straight into an ImageData buffer at reduced resolution. Move the pointer across a cloud.</p>
  </main>
  <div class="strip"><canvas class="cloud" data-direction="fill" data-seed="3"></canvas></div>
  <div class="body"><p>Each canvas shares one pair of noise tables; only the seed offset and vertical ramp differ.</p></div>
  <div class="foot"><canvas class="cloud" data-direction="up" data-seed="7"></canvas></div>

<script type="module">
const BAYER = [
  [0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],
  [12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],
  [3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],
  [15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21],
].map(row => Float32Array.from(row, v => (v + 0.5) / 64));

const PALETTE = Uint32Array.from([
  [0,0,0,0],[7,16,48,255],[12,36,104,255],[18,66,172,255],
  [32,114,228,255],[104,184,255,255],[222,243,255,255],
].map(([r,g,b,a]) => (r | g << 8 | b << 16 | a << 24) >>> 0));

const MAX = PALETTE.length - 1;

const smooth = t => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

function hash(a, b) {
  let h = Math.imul(a, 0x165667b1) + Math.imul(b, 0x27d4eb2f) | 0;
  h = Math.imul(h ^ h >>> 13, 0x4bf19f61);
  return ((h ^ h >>> 16) >>> 0) / 0x100000000;
}

function buildNoiseTable(seed) {
  const table = new Float32Array(65536);
  let amp = 1, size = 4, total = 0;
  for (let octave = 0; octave < 5; octave++) {
    const lattice = new Float32Array(size * size);
    for (let i = 0; i < lattice.length; i++) lattice[i] = hash(i + 1, 131 * seed + 17 * octave);
    for (let y = 0; y < 256; y++) {
      const fy = y / 256 * size, y0 = fy | 0, y1 = (y0 + 1) % size, ty = smooth(fy - y0);
      for (let x = 0; x < 256; x++) {
        const fx = x / 256 * size, x0 = fx | 0, x1 = (x0 + 1) % size, tx = smooth(fx - x0);
        table[256 * y + x] += lerp(
          lerp(lattice[y0 * size + x0], lattice[y0 * size + x1], tx),
          lerp(lattice[y1 * size + x0], lattice[y1 * size + x1], tx), ty) * amp;
      }
    }
    total += amp; amp *= 0.55; size *= 2;
  }
  for (let i = 0; i < table.length; i++) table[i] /= total;
  return table;
}

function sample(table, x, y) {
  x = (x % 256 + 256) % 256; y = (y % 256 + 256) % 256;
  const x0 = x | 0, y0 = y | 0, tx = x - x0, ty = y - y0;
  const x1 = x0 + 1 & 255, y1 = y0 + 1 & 255;
  return lerp(
    lerp(table[256 * y0 + x0], table[256 * y0 + x1], tx),
    lerp(table[256 * y1 + x0], table[256 * y1 + x1], tx), ty);
}

let tables = null;

function createCloud(canvas, { direction = 'down', seed = 0, intensity = 1, interactive = true } = {}) {
  const ctx = canvas.getContext('2d', { alpha: true });
  tables ??= { warp: buildNoiseTable(2), shape: buildNoiseTable(1) };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const offsetX = 41.3 * seed, offsetY = 67.9 * seed;

  let scale = 2, w = 1, h = 1, gw = 1, gh = 1;
  let image = null, buf = new Uint32Array(1);
  let field = new Float32Array(1), glow = new Float32Array(1), ramp = new Float32Array(1);
  let raf = 0, last = 0, time = 3.7 * seed, visible = !document.hidden;
  const pointer = { cx: 0, cy: 0, over: false, x: 0, y: 0, strength: 0 };

  function resize() {
    const rect = canvas.getBoundingClientRect();
    scale = Math.max(2, Math.ceil(rect.width / 760));
    w = Math.max(1, Math.ceil(rect.width / scale));
    h = Math.max(1, Math.ceil(rect.height / scale));
    canvas.width = w; canvas.height = h;
    image = ctx.createImageData(w, h);
    buf = new Uint32Array(image.data.buffer);
    gw = Math.floor(w / 4) + 2; gh = Math.floor(h / 4) + 2;
    field = new Float32Array(gw * gh);
    glow = new Float32Array(gw * gh);
    ramp = Float32Array.from({ length: h }, (_, y) => {
      const t = direction === 'up' ? 1 - y / h : y / h;
      return direction === 'fill' ? 0.62 + 0.25 * (1 - t) : 1.05 * Math.pow(1 - t, 1.3);
    });
  }

  function draw() {
    if (!image) return;
    const step = 256 / (1.1 * w);
    for (let gy = 0; gy < gh; gy++) {
      const ny = 4 * gy * step + offsetY;
      for (let gx = 0; gx < gw; gx++) {
        const nx = 4 * gx * step + offsetX;
        const warp = sample(tables.warp, 0.7 * nx + 1.1 * time, 0.7 * ny + 1.6 * time);
        const mid = sample(tables.shape, 0.85 * nx + (warp - 0.5) * 95 + 0.7 * time, 0.85 * ny + (warp - 0.5) * 95);
        const dense = sample(tables.shape, nx + (mid - 0.5) * 80, ny + (mid - 0.5) * 80 + 2.4 * time);
        const ridge = 1 - Math.abs(2 * mid - 1);
        const shaped = smooth(clamp01((dense - 0.2) / 0.5));
        field[gy * gw + gx] = (0.3 + 0.85 * shaped) * (0.5 + 0.6 * (1 - ridge * ridge));
      }
    }

    let target = 0;
    if (pointer.over) {
      const rect = canvas.getBoundingClientRect();
      if (pointer.cx >= rect.left && pointer.cx <= rect.right && pointer.cy >= rect.top && pointer.cy <= rect.bottom) {
        target = 1;
        pointer.x = (pointer.cx - rect.left) / scale;
        pointer.y = (pointer.cy - rect.top) / scale;
      }
    }
    pointer.strength += (target - pointer.strength) * 0.05;
    const lit = pointer.strength > 0.01;
    if (lit) {
      const sigma = 0.1 * w, falloff = 1 / (2 * sigma * sigma), amp = 0.5 * pointer.strength * MAX;
      for (let gy = 0; gy < gh; gy++) {
        const dy = 4 * gy - pointer.y;
        for (let gx = 0; gx < gw; gx++) {
          const dx = 4 * gx - pointer.x;
          glow[gy * gw + gx] = amp * Math.exp(-(dx * dx + dy * dy) * falloff);
        }
      }
    }

    const gain = intensity * (1 + 0.05 * Math.sin(0.6 * time)) * MAX;
    for (let y = 0; y < h; y++) {
      const top = (y >> 2) * gw, bottom = top + gw, fy = (y & 3) * 0.25;
      const vy = ramp[y] * gain, dither = BAYER[y & 7], out = y * w;
      for (let x = 0; x < w; x++) {
        const a = top + (x >> 2), b = bottom + (x >> 2), fx = (x & 3) * 0.25;
        const upper = field[a] + (field[a + 1] - field[a]) * fx;
        const lower = field[b] + (field[b + 1] - field[b]) * fx;
        let value = (upper + (lower - upper) * fy) * vy + dither[x & 7];
        if (lit) {
          const gu = glow[a] + (glow[a + 1] - glow[a]) * fx;
          const gl = glow[b] + (glow[b + 1] - glow[b]) * fx;
          value += gu + (gl - gu) * fy;
        }
        let index = value | 0;
        if (index > MAX) index = MAX;
        buf[out + x] = PALETTE[index];
      }
    }
    ctx.putImageData(image, 0, 0);
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (!visible) { last = 0; return; }
    if (last && now - last < 1000 / 24) return;
    if (last) time += Math.min(0.1, (now - last) / 1000);
    last = now;
    draw();
  }

  function start() { if (!raf && !reduced) { last = 0; raf = requestAnimationFrame(frame); } }
  function stop() { cancelAnimationFrame(raf); raf = 0; }

  const onMove = e => { pointer.cx = e.clientX; pointer.cy = e.clientY; pointer.over = true; };
  const onLeave = () => { pointer.over = false; };
  const onVisibility = () => { visible = !document.hidden; };
  const observer = new ResizeObserver(() => { resize(); draw(); });

  resize();
  draw();
  observer.observe(canvas);
  document.addEventListener('visibilitychange', onVisibility);
  if (interactive) {
    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('pointerleave', onLeave, { passive: true });
  }
  start();

  return () => {
    stop();
    observer.disconnect();
    document.removeEventListener('visibilitychange', onVisibility);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerleave', onLeave);
  };
}

for (const canvas of document.querySelectorAll('.cloud')) {
  createCloud(canvas, {
    direction: canvas.dataset.direction,
    seed: Number(canvas.dataset.seed) || 0,
  });
}
</script>
</body>
</html>
