name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build engine
        run: pnpm --filter @dawitlabs/pixelfield build

      - name: Unit tests
        run: pnpm --filter @dawitlabs/pixelfield test

      - name: Typecheck site
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build site
        run: pnpm build
