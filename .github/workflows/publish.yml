name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use an npm CLI that supports trusted publishing
        run: npm install -g npm@latest

      - name: Report toolchain
        run: |
          node --version
          npm --version

      - run: pnpm install --frozen-lockfile

      - name: Build and test engine
        run: |
          pnpm --filter @dawitlabs/pixelfield build
          pnpm --filter @dawitlabs/pixelfield test

      - name: Publish via trusted publishing (OIDC, no token)
        run: npm publish --access public
        working-directory: packages/core
